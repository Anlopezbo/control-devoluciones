services:
  db:
    image: postgres:17
    container_name: control_devoluciones_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME no está definida}
      POSTGRES_USER: ${DB_USER:?DB_USER no está definida}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD no está definida}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
